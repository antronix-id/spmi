name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🛠️ Build Next.js
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: 🧹 Clean Dev & Webpack Cache
        run: |
          rm -rf .next/cache .next/dev || true

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || 'cpanel.unpal.ac.id' }}
          username: ${{ secrets.FTP_USERNAME || 'unpx1994' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: spmi-app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .next/cache/**
            .next/dev/**
            *.zip
            .env.local
